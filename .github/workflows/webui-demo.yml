name: WebUI demo on GitHub Pages

# The read-only WebUI demo (platform/web, `npm run build:demo`): the real interface with fictional
# data answered in the browser, published at https://<owner>.github.io/<repository>/ and linked
# from the README's "Live preview".

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/webui-demo.yml"
      - "platform/web/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - name: Build the demo
        working-directory: platform/web
        run: npm ci && npm run build:demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: platform/web/dist-demo
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write    # Deploy to GitHub Pages
      id-token: write # Federate via OIDC for Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
