# SPDX-License-Identifier: MIT

# Publishes the two images an installation runs, so a host deploys in minutes instead of
# compiling the Rust server: the control plane (Go API + WebUI) and the fork's Lore server.
name: Platform Images

# A release publishes its images through platform-release.yml, only after every check passed.
# Run by hand to publish a tag such as "edge".
on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to publish.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish, for example "edge" or "0.1.12-rc1".
        type: string
        required: true

permissions: {}

concurrency:
  group: platform-images-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lore-platform-control-plane
            dockerfile: platform/Dockerfile
          - image: lore-platform-server
            dockerfile: lore-server/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: names
        name: Resolve the image name and tag
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=${INPUT_TAG:-${REF_NAME#platform-v}}
          if ! printf '%s' "$tag" | grep -qE '^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$'; then
            echo "::error::'$tag' is not a valid image tag"; exit 1
          fi
          echo "image=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.image }}:${{ steps.names.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
