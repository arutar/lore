name: Windows Client

on:
  pull_request:
    paths:
      - ".github/workflows/windows-client.yml"
      - "platform/windows/**"
  push:
    branches: [main]
    tags: ["platform-v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test MSI
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platform/windows/LoreCompanion.Web/package-lock.json

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "0.1.0"
          $releaseTag = ""
          if ($env:GITHUB_REF_NAME -like "platform-v*") {
            if ($env:GITHUB_REF_NAME -notmatch '^platform-v(\d+\.\d+\.\d+(\.\d+)?)$') {
              throw "Platform release tags must use platform-vX.Y.Z"
            }
            $version = $Matches[1]
            $releaseTag = $env:GITHUB_REF_NAME
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Build the client
        shell: pwsh
        run: platform/windows/Build-Client.ps1 -PlatformVersion ${{ steps.version.outputs.version }}

      - name: Test the companion
        shell: pwsh
        run: dotnet test platform/windows/LoreCompanion.Tests/LoreCompanion.Tests.csproj -v minimal

      - name: Test the shell extension
        shell: pwsh
        run: ctest --test-dir platform/windows/LoreShell/build -C Release --output-on-failure

      - name: Build MSI
        shell: pwsh
        run: platform/windows/Build-Msi.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Test MSI install and uninstall
        shell: pwsh
        run: platform/windows/Test-Msi.ps1

      - name: Create checksums
        shell: pwsh
        run: |
          Push-Location platform/windows/bin
          Get-FileHash LoreClient-x64.msi, LoreClient-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS -Encoding ascii
          Pop-Location

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-client-${{ github.sha }}
          path: |
            platform/windows/bin/LoreClient-x64.msi
            platform/windows/bin/LoreClient-win-x64.zip
            platform/windows/bin/SHA256SUMS
            platform/windows/bin/msi-smoke/*.log
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish platform release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/platform-v')
    needs: build
    runs-on: windows-latest
    environment: platform-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-client-${{ github.sha }}
          path: release

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ needs.build.outputs.release_tag }}" release/* --title "${{ needs.build.outputs.release_tag }}" --generate-notes
